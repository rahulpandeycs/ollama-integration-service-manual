spring:
  datasource:
    driverClassName: org.h2.Driver
    username: sa
    password:
    url: jdbc:h2:mem:playerdb
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  config:
    use-legacy-processing: true
  h2:
    console:
      enabled: true

server:
  port: 8080
  include-debug-info: true
  error:
    include-message: always

player-service-model:
  base-url: ${PLAYER_SERVICE_MODEL_BASE_URL:http://localhost:5000}
  connect-timeout: ${PLAYER_SERVICE_MODEL_CONNECT_TIMEOUT:2s}
  read-timeout: ${PLAYER_SERVICE_MODEL_READ_TIMEOUT:10s}

